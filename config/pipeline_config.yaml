# Central configuration for warnflame-analytics pipeline

data:
  calfire:
    min_year: 2000
    max_year: 2024
    min_acres: 10.0
    max_acres: 1000000.0
    required_methods: ['GPS', 'IMAGERY']

  gridmet:
    variables: ['tmmx', 'tmmn', 'pr', 'vs', 'erc', 'bi']
    windows: [7, 14, 30]
    cache_expire_days: 30

  dem:
    resolution: 10
    crs: 'EPSG:5070'

  roads:
    path: 'data/raw/california_roads.gpkg'
    tiger_url: 'https://www2.census.gov/geo/tiger/TIGER2024/PRISECROADS/tl_2024_06_prisecroads.zip'
    crs: 'EPSG:5070'

  sentinel2:
    enabled: true
    cloud_threshold: 20
    resolution: 250
    max_scenes: 40
    batch_size: 10
    stack_epsg: 5070
    scene_selection: spatial
    composite_months: [6, 7, 8, 9]
    point_fallback_on_miss: true
    point_max_scenes: 8
    ndvi_path: 'cache/sentinel2_ndvi_ca.tif'
    ndmi_path: 'cache/sentinel2_ndmi_ca.tif'

features:
  spatial:
    n_clusters: 10
    min_distance_km: 50

  weather:
    aggregations: ['max', 'mean', 'sum']
    required_completeness: 0.9

  terrain:
    slope_method: 'central_differences'
    aspect_method: 'compass'

  build:
    fires_path: 'data/interim/fires_with_centroids.gpkg'
    weather_path: 'data/interim/fires_weather_joined.parquet'
    terrain_path: 'data/interim/fires_terrain_joined.parquet'
    spatial_path: 'data/interim/fires_spatial_joined.parquet'
    vegetation_path: 'data/interim/fires_vegetation_joined.parquet'
    output_path: 'data/processed/feature_matrix.parquet'
    pseudo_absence_ratio: 1.0
    min_distance_km: 2.0
    max_placement_attempts: 500
    random_state: 42
    required_modalities: ['weather', 'terrain', 'spatial']

model:
  spatial_cv:
    feature_matrix_path: 'data/processed/feature_matrix.parquet'
    groups_path: 'models/spatial_groups.npy'
    results_path: 'models/spatial_cv_results.json'
    n_spatial_groups: 10
    min_group_separation_km: 30
    random_state: 42

  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 50
    min_samples_leaf: 20
    max_features: 'sqrt'
    class_weight: 'balanced'
    random_state: 42
    n_jobs: -1

  cross_validation:
    n_folds: 5
    scoring: 'roc_auc'
    shuffle: true

  hyperparameter_tuning:
    enabled: false
    n_iter: 20
    cv_folds: 3

visualization:
  shap:
    n_samples: 1000
    top_features: 5

  plots:
    dpi: 300
    format: 'png'
    figsize: [10, 8]

output:
  model_dir: 'models'
  figures_dir: 'reports/figures'
  risk_weights_path: 'models/risk_weights.json'
  cv_results_path: 'models/spatial_cv_results.json'

logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: 'logs/pipeline.log'
